services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+psycopg2://moon:moon123@db:5432/learning_db
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: moon
      POSTGRES_PASSWORD: moon123
      POSTGRES_DB: learning_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moon -d learning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: